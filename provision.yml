---
- name: Provision homelab development machines
  hosts: provision_targets
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate the provisioning host platform
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_pkg_mgr == "apt"
          - ansible_service_mgr == "systemd"
        fail_msg: >-
          Unsupported provisioning platform: {{ ansible_distribution }}
          {{ ansible_distribution_version }}, package manager
          {{ ansible_pkg_mgr }}, service manager {{ ansible_service_mgr }}.
          This playbook supports Debian-family systems using apt and systemd.

    - name: Read the primary user's account information
      ansible.builtin.getent:
        database: passwd
        key: "{{ primary_user }}"

    - name: Record the primary user's home directory
      ansible.builtin.set_fact:
        primary_user_home: "{{ ansible_facts.getent_passwd[primary_user][4] }}"

  roles:
    - role: common
    - role: development
    - role: ebpf
      when: install_ebpf_tools | bool
    - role: golang
      when: install_go | bool
    - role: rust
      when: install_rust | bool
    - role: docker
      when: install_docker | bool
    - role: kubectl
      when: install_kubectl | bool
    - role: helm
      when: install_helm | bool
    - role: vnc
      when: install_vnc | bool
