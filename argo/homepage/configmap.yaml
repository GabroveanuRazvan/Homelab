---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true

  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  services.yaml: |
    - Infrastructure:
        - Pi-hole:
            icon: pi-hole.png
            href: http://nas.home:12000/admin/
            description: Network-wide DNS and ad blocking
        - qBittorrent:
            icon: qbittorrent.png
            href: http://nas.home:9111/
            description: Torrent client
        - ASUS Router:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/asus.png
            href: http://192.168.50.1/
            description: Network router administration
        - Synology NAS:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/synology-dsm.png
            href: http://nas.home:5000/
            description: Network attached storage administration

  bookmarks.yaml: "[]"
  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
