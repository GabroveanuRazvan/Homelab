---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackpeek
  namespace: rackpeek
  labels:
    app.kubernetes.io/name: rackpeek
    app.kubernetes.io/part-of: rackpeek
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rackpeek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rackpeek
        app.kubernetes.io/part-of: rackpeek
    spec:
      nodeSelector:
        homelab.io/storage-safe: "true"
      containers:
        - name: rackpeek
          image: aptacode/rackpeek:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: rackpeek-pvc
