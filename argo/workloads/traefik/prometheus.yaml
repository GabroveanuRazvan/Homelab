---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prometheus
    gethomepage.dev/description: Metrics collection and query UI
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: prometheus.png
    gethomepage.dev/href: http://prometheus.home/
    gethomepage.dev/app: prometheus-monitoring-kube-prometheus-prometheus
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`prometheus.home`)
      services:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090
