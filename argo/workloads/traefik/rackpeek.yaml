---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rackpeek
  namespace: rackpeek
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: RackPeek
    gethomepage.dev/description: Homelab inventory and topology
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: mdi-server-network
    gethomepage.dev/href: http://rackpeek.home/
    gethomepage.dev/app: rackpeek
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`rackpeek.home`)
      services:
        - name: rackpeek
          port: 8080
