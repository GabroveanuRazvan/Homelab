---
crds:
  create: false

controller:
  type: deployment
  replicas: 1

alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    create: false
    name: alloy
    key: config.alloy

# The chart creates a Role in jellyfin and binds it to Alloy's ServiceAccount
# in logging. Alloy cannot list or read logs from other namespaces.
rbac:
  namespaces:
    - jellyfin
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]
