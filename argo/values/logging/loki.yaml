---
# One small Loki instance for Jellyfin logs. The filesystem store and PVC are
# node-local; this is intentionally not an HA or cluster-wide logging setup.
deploymentMode: Monolithic

rbac:
  namespaced: true
sidecar:
  rules:
    enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  sidecar: false
  nodeSelector:
    homelab.io/storage-safe: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    whenDeleted: Retain
    whenScaled: Retain

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Avoid the chart's default gateway, per-node canary, and two Memcached pods.
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
