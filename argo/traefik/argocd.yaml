---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/description: Kubernetes GitOps
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: argocd.png
    gethomepage.dev/href: http://argocd.home/
    gethomepage.dev/app: argocd-server
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.home`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
    - kind: Rule
      match: Host(`argocd.home`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
