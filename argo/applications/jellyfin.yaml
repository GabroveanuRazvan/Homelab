---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/argo/values/jellyfin/values.yaml
    - repoURL: git@github.com:GabroveanuRazvan/Homelab.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:GabroveanuRazvan/Homelab.git
      targetRevision: main
      path: argo/workloads/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
