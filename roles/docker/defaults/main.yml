---
docker_apt_architectures:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
docker_apt_distribution: "{{ ansible_distribution | lower }}"
docker_apt_repository_url: >-
  https://download.docker.com/linux/{{ docker_apt_distribution }}
docker_packages:
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
