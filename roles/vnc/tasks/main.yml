---
- name: Install TigerVNC packages
  ansible.builtin.apt:
    name: "{{ vnc_packages + (vnc_desktop_packages if install_desktop_environment else []) }}"
    state: present

- name: Create the TigerVNC configuration directory
  ansible.builtin.file:
    path: "{{ primary_user_home }}/.vnc"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0700"

- name: Configure the VNC X11 session
  ansible.builtin.template:
    src: xstartup.j2
    dest: "{{ primary_user_home }}/.vnc/xstartup"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  notify: Restart TigerVNC

- name: Install the TigerVNC systemd unit
  ansible.builtin.template:
    src: homelab-vnc.service.j2
    dest: /etc/systemd/system/homelab-vnc.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart TigerVNC

- name: Check whether a VNC password has been initialized
  ansible.builtin.stat:
    path: "{{ primary_user_home }}/.vnc/passwd"
  register: vnc_password_file

- name: Secure the VNC password file
  ansible.builtin.file:
    path: "{{ primary_user_home }}/.vnc/passwd"
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0600"
  when: vnc_password_file.stat.exists

- name: Enable and start TigerVNC after password initialization
  ansible.builtin.systemd_service:
    name: homelab-vnc.service
    state: started
    enabled: true
    daemon_reload: true
  when: vnc_password_file.stat.exists

- name: Leave TigerVNC disabled until a password is initialized
  ansible.builtin.systemd_service:
    name: homelab-vnc.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: not vnc_password_file.stat.exists

- name: Explain the one-time VNC password bootstrap
  ansible.builtin.debug:
    msg: >-
      TigerVNC is installed but disabled because {{ primary_user_home }}/.vnc/passwd
      does not exist. As {{ primary_user }}, run
      'tigervncpasswd {{ primary_user_home }}/.vnc/passwd', then rerun this
      playbook. The service will listen on TCP {{ 5900 + (vnc_display | int) }}.
  when: not vnc_password_file.stat.exists
