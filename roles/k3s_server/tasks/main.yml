---
- name: Check whether the k3s server service is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_unit

- name: Configure the k3s server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s server
  no_log: true

- name: Install or upgrade the pinned k3s server
  ansible.builtin.command:
    argv: ["{{ k3s_install_script_path }}"]
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: >-
    k3s_version not in installed_k3s.stdout or
    not k3s_server_unit.stat.exists

- name: Enable and start the k3s server
  ansible.builtin.systemd_service:
    name: "{{ k3s_server_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Read the primary user's account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ primary_user }}"

- name: Record the primary user's home directory for k3s
  ansible.builtin.set_fact:
    k3s_primary_user_home: "{{ ansible_facts.getent_passwd[primary_user][4] }}"

- name: Make the k3s kubeconfig discoverable for the primary user
  ansible.builtin.copy:
    dest: /etc/profile.d/k3s.sh
    content: |
      # Managed by Ansible
      if [ "${USER:-}" = "{{ primary_user }}" ]; then
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      fi
    owner: root
    group: root
    mode: "0644"

- name: Add the k3s kubeconfig to the primary user's zsh environment
  ansible.builtin.lineinfile:
    path: "{{ k3s_primary_user_home }}/.zshrc"
    line: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    insertafter: EOF
    create: true
    mode: "0644"
  become_user: "{{ primary_user }}"
