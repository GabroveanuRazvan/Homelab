---
- name: Install the eBPF toolchain
  block:
    - name: Install eBPF development packages and running-kernel headers
      ansible.builtin.apt:
        name: "{{ ebpf_packages + ['linux-headers-' + ansible_kernel] }}"
        state: present
  rescue:
    - name: Explain a missing eBPF package or kernel headers package
      ansible.builtin.fail:
        msg: >-
          Could not install the eBPF toolchain or headers for the running kernel
          (linux-headers-{{ ansible_kernel }}). Ensure the matching Ubuntu repository
          is enabled and reboot into a supported Ubuntu kernel, then rerun the
          playbook. apt said: {{ ansible_failed_result.msg | default('no details returned') }}

- name: Verify installed eBPF commands
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [clang, --version]
    - [llvm-config, --version]
    - [bpftool, version]
  changed_when: false
