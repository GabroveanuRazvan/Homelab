---
- name: Validate the pinned k3s version
  ansible.builtin.assert:
    that:
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
    fail_msg: >-
      k3s_version must be an exact release such as v1.36.4+k3s1, not
      {{ k3s_version }}.

- name: Install k3s host prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the installer from the pinned k3s release
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check the installed k3s version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: installed_k3s
  failed_when: false
  changed_when: false
  check_mode: false
