---
- name: Validate the k3s host platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_pkg_mgr == "apt"
      - ansible_service_mgr == "systemd"
      - ansible_architecture in k3s_supported_architectures
    fail_msg: >-
      Unsupported k3s host platform: {{ ansible_distribution }}
      {{ ansible_distribution_version }}, package manager {{ ansible_pkg_mgr }},
      service manager {{ ansible_service_mgr }}, architecture
      {{ ansible_architecture }}. This role supports Debian-family systems using
      apt and systemd on {{ k3s_supported_architectures | join(', ') }}.

- name: Read the available cgroup v2 controllers
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/cgroup.controllers
  register: k3s_cgroup_v2_controllers
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check for the legacy cgroup v1 memory controller
  ansible.builtin.stat:
    path: /sys/fs/cgroup/memory
  register: k3s_cgroup_v1_memory

- name: Require the memory cgroup controller
  ansible.builtin.assert:
    that:
      - >-
        'memory' in
        ((k3s_cgroup_v2_controllers.content | default('') | b64decode).split())
        or k3s_cgroup_v1_memory.stat.isdir | default(false)
    fail_msg: >-
      The memory cgroup controller required by k3s is not enabled. On Raspberry
      Pi OS, append "cgroup_memory=1 cgroup_enable=memory" to
      /boot/firmware/cmdline.txt (or /boot/cmdline.txt on older releases), then
      reboot the host and rerun this playbook.

- name: Validate the pinned k3s version
  ansible.builtin.assert:
    that:
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
    fail_msg: >-
      k3s_version must be an exact release such as v1.36.4+k3s1, not
      {{ k3s_version }}.

- name: Install k3s host prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the installer from the pinned k3s release
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check the installed k3s version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: installed_k3s
  failed_when: false
  changed_when: false
  check_mode: false
