# Add the mini-PC address when it is ready.
[mini_pcs]
mini-pc ansible_host=mini-pc.home

[raspberry_pis]
pi1 ansible_host=pi1.home
pi2 ansible_host=pi2.home

[nas_hosts]
nas ansible_host=nas-k3s.home

[vms]
# vm1 ansible_host=192.168.122.29

# Exactly one host is supported here by the initial cluster bootstrap playbook.
[k3s_control_plane]
mini-pc

[k3s_workers]
# Add worker host aliases already declared elsewhere in this inventory, for example:
# pi1
# pi2

[k3s_cluster:children]
k3s_control_plane
k3s_workers

[provision_targets:children]
mini_pcs
raspberry_pis
nas_hosts

[homelab:children]
mini_pcs
raspberry_pis
nas_hosts
vms

[all:vars]
ansible_user=razvan
